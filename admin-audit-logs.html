<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartAttend - Audit Logs</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #020617, #0f172a, #172554);
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #60a5fa;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #2563eb;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.18);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .search {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #020617;
            color: white;
            outline: none;
        }

        .back-btn {
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: transparent;
            color: #cbd5e1;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #1e293b;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #2563eb;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
        }

        tr:hover {
            background: rgba(30, 41, 59, 0.7);
        }

        .message {
            padding: 15px;
            text-align: center;
            color: #94a3b8;
        }

        .error {
            color: #fca5a5;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .back-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📜 Audit Logs</h1>

    <div class="subtitle">
        Admin Control Center → View important administrative actions and system changes.
    </div>

    <div class="card">

        <div class="top-bar">

            <input
                type="text"
                id="search"
                class="search"
                placeholder="Search audit logs..."
                oninput="filterLogs()"
            >

            <button
                class="back-btn"
                onclick="goBack()"
            >
                ← Back to Admin Dashboard
            </button>

        </div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Action</th>
                        <th>Description</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>

                <tbody id="logTable">

                    <tr>
                        <td colspan="4" class="message">
                            Loading audit logs...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

let allLogs = [];


async function loadLogs() {

    const table = document.getElementById("logTable");

    try {

        const response = await fetch("/api/admin/audit-logs");

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Unable to load audit logs."
            );
        }

        allLogs = data.logs || [];

        displayLogs(allLogs);

    } catch (error) {

        console.error(error);

        table.innerHTML = `
            <tr>
                <td colspan="4" class="message error">
                    ❌ Unable to load audit logs from backend.
                </td>
            </tr>
        `;
    }
}


function displayLogs(logs) {

    const table = document.getElementById("logTable");

    if (!logs.length) {

        table.innerHTML = `
            <tr>
                <td colspan="4" class="message">
                    No audit logs available.
                </td>
            </tr>
        `;

        return;
    }

    table.innerHTML = logs.map(function(log) {

        return `
            <tr>
                <td>${log.id ?? ""}</td>
                <td>${log.action ?? ""}</td>
                <td>${log.description ?? ""}</td>
                <td>${log.created_at ?? ""}</td>
            </tr>
        `;

    }).join("");
}


function filterLogs() {

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const filtered =
        allLogs.filter(function(log) {

            return (
                String(log.id ?? "").toLowerCase().includes(search) ||
                String(log.action ?? "").toLowerCase().includes(search) ||
                String(log.description ?? "").toLowerCase().includes(search) ||
                String(log.created_at ?? "").toLowerCase().includes(search)
            );

        });

    displayLogs(filtered);
}


function goBack() {

    window.location.href =
        "admin-dashboard.html";

}


loadLogs();

</script>

</body>
</html>
