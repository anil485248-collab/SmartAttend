<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teacher Portal - SmartAttend</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(33,150,243,.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(0,110,255,.14),
                    transparent 30%
                ),
                #050b18;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;
        }


        .container {

            width: 100%;

            max-width: 850px;

            text-align: center;
        }


        .logo {

            font-size: 42px;

            font-weight: bold;

            color: #2196f3;

            margin-bottom: 10px;
        }


        .title {

            font-size: 30px;

            margin-bottom: 10px;
        }


        .subtitle {

            color: #91a3bf;

            margin-bottom: 40px;

            font-size: 16px;
        }


        .cards {

            display: flex;

            justify-content: center;

            gap: 25px;

            flex-wrap: wrap;
        }


        .card {

            width: 320px;

            padding: 35px 25px;

            background: rgba(15,28,50,.92);

            border:

                1px solid

                rgba(33,150,243,.25);

            border-radius: 20px;

            transition: .3s;

            box-shadow:

                0 15px 45px

                rgba(0,0,0,.35);
        }


        .card:hover {

            transform: translateY(-7px);

            border-color: #2196f3;

            box-shadow:

                0 15px 45px

                rgba(33,150,243,.15);
        }


        .icon {

            font-size: 45px;

            margin-bottom: 15px;
        }


        .card h2 {

            margin-bottom: 10px;
        }


        .card p {

            color: #91a3bf;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #1479e9;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: .2s;
        }


        button:hover {

            background: #0d5fbd;

            transform: translateY(-1px);
        }


        .back {

            width: 160px;

            margin-top: 35px;

            background: transparent;

            border: 1px solid #304563;

            color: #9db1cf;
        }


        .back:hover {

            background: #101d34;
        }


    </style>

</head>


<body>


    <div class="container">


        <div class="logo">

            SmartAttend

        </div>


        <div class="title">

            Teacher Portal

        </div>


        <div class="subtitle">

            Secure attendance access for authorized teachers

        </div>


        <div class="cards">


            <!-- EXISTING TEACHER -->

            <div class="card">

                <div class="icon">
                    🔐
                </div>


                <h2>

                    Existing Teacher

                </h2>


                <p>

                    Already registered?
                    Login using your Teacher ID
                    and password.

                </p>


                <button
                    onclick="existingTeacher()">

                    Teacher Login

                </button>

            </div>


            <!-- NEW TEACHER -->

            <div class="card">

                <div class="icon">
                    👨‍🏫
                </div>


                <h2>

                    New Teacher

                </h2>


                <p>

                    New teacher?
                    Register using your
                    authorized verification code.

                </p>


                <button
                    onclick="newTeacher()">

                    Teacher Registration

                </button>

            </div>


        </div>


        <button
            class="back"
            onclick="goBack()">

            ← Back

        </button>


    </div>


    <script>


       function existingTeacher() {
    window.location.href = "teacher-login.html";
}


       function newTeacher() {
    window.location.href = "teacher-register.html";
}


        function goBack() {

            window.location.href =
                "index.html";

        }


    </script>


</body>

</html>
