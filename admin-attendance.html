<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartAttend - Attendance</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #020617,
                #0f172a,
                #172554
            );
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            color: #60a5fa;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search {
            flex: 1;
            min-width: 250px;
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #020617;
            color: white;
            outline: none;
        }

        .search:focus {
            border-color: #3b82f6;
        }

        .back-btn {
            padding: 13px 20px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #1e293b;
            color: white;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #334155;
        }

        .count {
            margin-bottom: 15px;
            color: #94a3b8;
        }

        .card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.15);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 15px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
        }

        tr:hover td {
            background: rgba(30, 41, 59, 0.7);
        }

        .student-id {
            color: #60a5fa;
            font-weight: bold;
        }

        .present {
            color: #4ade80;
            font-weight: bold;
        }

        .absent {
            color: #f87171;
            font-weight: bold;
        }

        .percentage {
            font-weight: bold;
        }

        .good {
            color: #4ade80;
        }

        .warning {
            color: #facc15;
        }

        .danger {
            color: #f87171;
        }

        .status-message {
            padding: 30px;
            text-align: center;
            color: #94a3b8;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>📊 Attendance Records</h1>

        <p>
            Admin Control Center → View student attendance statistics
        </p>

    </div>


    <div class="top-bar">

        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="Search by name, Student ID, enrollment, program..."
            oninput="filterStudents()"
        >

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back to Admin Dashboard
        </button>

    </div>


    <div
        class="count"
        id="studentCount"
    >
        Loading attendance...
    </div>


    <div class="card">

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>Student ID</th>

                        <th>Name</th>

                        <th>Program</th>

                        <th>Branch</th>

                        <th>Semester</th>

                        <th>Present</th>

                        <th>Total Days</th>

                        <th>Attendance</th>

                    </tr>

                </thead>


                <tbody id="attendanceTable">

                    <tr>

                        <td
                            colspan="8"
                            class="status-message"
                        >
                            Loading attendance...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

let students = [];


/* =========================================
   LOAD ATTENDANCE
========================================= */

async function loadAttendance() {

    const table =
        document.getElementById(
            "attendanceTable"
        );

    try {

        const response =
            await fetch(
                "/api/admin/students"
            );

        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Unable to load attendance."
            );

        }


        students =
            data.students || [];


        displayStudents(students);

    }

    catch (error) {

        console.error(error);

        table.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="status-message"
                >
                    ❌ Unable to load attendance.
                </td>
            </tr>
        `;

        document.getElementById(
            "studentCount"
        ).textContent =
            "Unable to load attendance.";

    }

}


/* =========================================
   DISPLAY ATTENDANCE
========================================= */

function displayStudents(list) {

    const table =
        document.getElementById(
            "attendanceTable"
        );

    const count =
        document.getElementById(
            "studentCount"
        );


    count.textContent =
        "Total Students: " + list.length;


    if (list.length === 0) {

        table.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="status-message"
                >
                    No students found.
                </td>
            </tr>
        `;

        return;

    }


    table.innerHTML = "";


    list.forEach(student => {

        const row =
            document.createElement("tr");


        const attendance =
            Number(
                student.attendance_percentage || 0
            );


        let attendanceClass =
            "danger";


        if (attendance >= 75) {

            attendanceClass =
                "good";

        }

        else if (attendance >= 60) {

            attendanceClass =
                "warning";

        }


        row.innerHTML = `

            <td class="student-id">
                ${escapeHtml(
                    student.student_id
                )}
            </td>

            <td>
                ${escapeHtml(
                    student.name
                )}
            </td>

            <td>
                ${escapeHtml(
                    student.program
                )}
            </td>

            <td>
                ${escapeHtml(
                    student.branch || "N/A"
                )}
            </td>

            <td>
                ${escapeHtml(
                    student.semester || "N/A"
                )}
            </td>

            <td class="present">
                ${Number(
                    student.present_days || 0
                )}
            </td>

            <td>
                ${Number(
                    student.total_days || 0
                )}
            </td>

            <td class="percentage ${attendanceClass}">
                ${attendance}%
            </td>

        `;


        table.appendChild(row);

    });

}


/* =========================================
   SEARCH
========================================= */

function filterStudents() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    if (!search) {

        displayStudents(students);

        return;

    }


    const filtered =
        students.filter(student => {

            return (

                String(
                    student.student_id || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    student.name || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    student.enrollment || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    student.program || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    student.branch || ""
                )
                .toLowerCase()
                .includes(search)

            );

        });


    displayStudents(filtered);

}


/* =========================================
   HTML SAFETY
========================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   BACK
========================================= */

function goBack() {

    window.location.href =
        "admin-dashboard.html";

}


/* =========================================
   START
========================================= */

loadAttendance();

</script>

</body>
</html>
